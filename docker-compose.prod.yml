name: colombus-prod

include:
  - path: submodules/colombus/docker-compose.prod.yml
    env_file: submodules/colombus/.env
  - path: submodules/annotation/docker-compose.prod.yml
    env_file: submodules/annotation/.env
  - path: submodules/mlprofiler/docker/docker-compose.prod.yml
    env_file: submodules/mlprofiler/docker/.env

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - colombus-net

  wud:
    image: getwud/wud:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      WUD_TRIGGER_DOCKER_AUTO_PRUNE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud_data:/store

networks:
  colombus-net:
    external: true
    name: colombus-net

volumes:
  caddy_data:
  caddy_config:
  wud_data:

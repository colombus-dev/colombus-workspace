name: colombus-prod

include:
  - path: submodules/colombus/docker-compose.prod.yml
    env_file: submodules/colombus/.env
  - path: submodules/annotation/docker-compose.prod.yml
    env_file: submodules/annotation/.env
  - path: submodules/mlprofiler/docker/docker-compose.prod.yml
    env_file: submodules/mlprofiler/docker/.env

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - colombus-net

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  colombus-net:
    external: true
    name: colombus-net

volumes:
  caddy_data:
  caddy_config:
